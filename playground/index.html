<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinythree playground — 3D scenes in ~4× fewer tokens</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<style>
  :root { --bg:#0a0f1f; --panel:#111a33; --line:#1f2b4d; --text:#d7e3ff; --dim:#7f8db3; --accent:#00e5ff; --bad:#ff5c7a; --ok:#5cffb0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { height:52px; display:flex; align-items:center; gap:14px; padding:0 16px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:17px; letter-spacing:.3px; }
  header h1 b { color:var(--accent); }
  header .tag { color:var(--dim); font-size:13px; }
  header .sp { flex:1; }
  select, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  a { color:var(--accent); text-decoration:none; }
  main { display:grid; grid-template-columns:minmax(320px, 40%) 1fr; height:calc(100% - 52px - 34px); }
  .left { display:flex; flex-direction:column; border-right:1px solid var(--line); min-width:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { border:0; border-radius:0; background:transparent; padding:9px 14px; color:var(--dim); }
  .tabs button.on { color:var(--text); box-shadow:inset 0 -2px var(--accent); }
  textarea, pre { flex:1; margin:0; width:100%; resize:none; border:0; outline:0; padding:14px 16px; background:var(--bg); color:var(--text);
    font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size:2; white-space:pre; overflow:auto; }
  pre { display:none; color:#b9c6ea; }
  #err { min-height:0; padding:0 16px; color:var(--bad); font:12.5px ui-monospace, monospace; }
  #err:not(:empty) { padding:8px 16px; border-top:1px solid var(--line); }
  #view { position:relative; min-width:0; }
  #view canvas { display:block; }
  #hud { position:absolute; z-index:2; left:12px; bottom:12px; display:flex; gap:8px; }
  footer { height:34px; display:flex; align-items:center; gap:18px; padding:0 16px; border-top:1px solid var(--line); color:var(--dim); font-size:12.5px; }
  footer .n { color:var(--text); font-variant-numeric:tabular-nums; }
  footer .ratio { color:var(--ok); font-weight:600; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; grid-template-rows:45% 55%; } .left { border-right:0; border-bottom:1px solid var(--line); } header .tag { display:none; } }
</style>
</head>
<body>
<header>
  <h1><b>tiny</b>three</h1>
  <span class="tag">a tiny 3D scene language that compiles to Three.js — built for LLMs</span>
  <span class="sp"></span>
  <select id="ex" title="Examples"></select>
  <button id="dl" title="Download a standalone HTML page">⬇ HTML</button>
  <button id="prompt" title="Copy the system prompt that teaches an AI model this language">📋 AI prompt</button>
  <a href="https://github.com/muskec06/tinythree" target="_blank" rel="noopener">GitHub</a>
</header>
<main>
  <section class="left">
    <div class="tabs"><button class="on" data-t="src">scene.t3</button><button data-t="out">generated Three.js</button></div>
    <textarea id="src" spellcheck="false" aria-label="tinythree source"></textarea>
    <pre id="out"></pre>
    <div id="err"></div>
  </section>
  <section id="view">
    <div id="hud"><button id="play">⏸</button><button id="restart">⟲</button></div>
  </section>
</main>
<footer>
  <span>tinythree <span class="n" id="tt">0</span> tok</span>
  <span>compiled Three.js <span class="n" id="tj">0</span> tok</span>
  <a class="ratio" href="https://github.com/muskec06/tinythree/blob/main/bench/RESULTS.md" target="_blank" rel="noopener">≈3× fewer tokens than hand-written Three.js →</a>
  <span class="sp" style="flex:1"></span>
  <span>token counts are estimates · drag to orbit</span>
</footer>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { parse, compile, mount, toHTML } from '../src/tinythree.js';

const EXAMPLES = ['eiffel-tower', 'leaning-tower-pisa', 'giza-pyramids', 'stonehenge', 'london-eye', 'building', 'solar-farm', 'table-lamp', 'atom', 'vectors'];
const $ = (id) => document.getElementById(id);
const src = $('src'), out = $('out'), err = $('err'), view = $('view');
let api = null, timer = 0, fresh = true;

// Rough BPE-like estimate: words, numbers and each punctuation mark count as one token.
const tokens = (s) => (s.match(/[A-Za-z_]+|\d+|[^\sA-Za-z_\d]/g) || []).length;

function run() {
  const text = src.value;
  let code;
  try { code = compile(parse(text), { format: 'fn' }); err.textContent = ''; }
  catch (e) { err.textContent = e.message; return; }
  out.textContent = code;
  const a = tokens(text.replace(/\/\/.*$/gm, '')), b = tokens(code.replace(/\/\/.*$/gm, ''));
  $('tt').textContent = a; $('tj').textContent = b;
  let keep = null;
  if (!fresh && api?.controls) keep = { p: api.camera.position.clone(), t: api.controls.target.clone() };
  try {
    const built = new Function('THREE', code + '\nreturn build(THREE);')(THREE);
    api?.dispose();
    api = mount(THREE, built, view, { OrbitControls });
    if (keep && !built.opts.camAnim) { api.camera.position.copy(keep.p); api.controls.target.copy(keep.t); }
    $('play').textContent = '⏸';
    window.tinythree = api; fresh = false;
  } catch (e) { err.textContent = 'runtime: ' + e.message; }
}

src.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { run(); localStorage.setItem('tt-src', src.value); }, 250); });
src.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); const s = src.selectionStart; src.setRangeText('  ', s, src.selectionEnd, 'end'); src.dispatchEvent(new Event('input')); }
});
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  src.style.display = b.dataset.t === 'src' ? 'block' : 'none';
  out.style.display = b.dataset.t === 'out' ? 'block' : 'none';
});
$('play').onclick = () => { if (!api) return; const p = $('play').textContent === '⏸'; p ? api.pause() : api.play(); $('play').textContent = p ? '▶' : '⏸'; };
$('restart').onclick = () => { api?.seek(0); api?.play(); $('play').textContent = '⏸'; };
$('dl').onclick = () => {
  try {
    const blob = new Blob([toHTML(src.value)], { type: 'text/html' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: ($('ex').value || 'scene') + '.html' });
    a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { err.textContent = e.message; }
};
$('prompt').onclick = async () => {
  const text = await (await fetch('../ai/SYSTEM_PROMPT.md')).text();
  try { await navigator.clipboard.writeText(text); $('prompt').textContent = '✓ copied'; }
  catch { open('../ai/SYSTEM_PROMPT.md'); }
  setTimeout(() => $('prompt').textContent = '📋 AI prompt', 1500);
};

const ex = $('ex');
ex.innerHTML = EXAMPLES.map((n) => `<option>${n}</option>`).join('');
async function load(name) {
  src.value = await (await fetch(`../examples/${name}.t3`)).text();
  fresh = true;
  run();
}
ex.onchange = () => { history.replaceState(null, '', '#' + ex.value); load(ex.value); };
const start = location.hash.slice(1);
let saved = null;
try { saved = localStorage.getItem('tt-src'); } catch {}
if (EXAMPLES.includes(start)) { ex.value = start; load(start); }
else if (saved) { ex.value = ''; src.value = saved; run(); }
else load(EXAMPLES[0]);
</script>
</body>
</html>
